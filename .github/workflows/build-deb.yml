name: Build OpentiaFiles .deb

on:
  push:
    branches: [ opentiafiles-48 ]
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install base tooling
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Enable deb-src and refresh
        run: |
          set -eux
          for f in /etc/apt/sources.list.d/*.sources; do
            [ -f "$f" ] && sed -i 's/^Types: deb$/Types: deb deb-src/' "$f" || true
          done
          if [ -f /etc/apt/sources.list ]; then
            grep -q '^deb-src' /etc/apt/sources.list || true
          fi
          apt-get update

      - name: Install build dependencies
        run: |
          set -eux
          apt-get install -y --no-install-recommends \
            build-essential meson ninja-build pkg-config gettext dpkg-dev \
            desktop-file-utils blueprint-compiler || true
          apt-get build-dep -y nautilus || true
          apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libglib2.0-dev libgnome-desktop-4-dev \
            libgexiv2-dev libportal-dev libxml2-dev libgdk-pixbuf-2.0-dev \
            libcloudproviders-dev libexif-dev libselinux1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gsettings-desktop-schemas-dev || true
          apt-get install -y --no-install-recommends gnome-autoar-0-dev libgnome-autoar-0-dev || true
          apt-get install -y --no-install-recommends libtracker-sparql-3.0-dev libtinysparql-dev || true
          apt-get install -y --no-install-recommends libglycin-2-dev libglycin-gtk4-2-dev || true

      - name: Show dependency versions
        run: pkg-config --modversion gtk4 libadwaita-1 glib-2.0 2>/dev/null || true

      - name: Configure
        run: meson setup builddir --prefix=/usr -Dtests=none

      - name: Build
        run: ninja -C builddir

      - name: Package .deb
        run: bash packaging/make-deb.sh

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: opentiafiles-deb-48
          path: opentiafiles_*.deb
          if-no-files-found: error
