name: Build OpentiaFiles .deb (GNOME 48/49 and GNOME 50)

on:
  push:
    branches: [ builds ]
  workflow_dispatch:

jobs:
  build-48-49:
    name: .deb for GNOME 48 / 49
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Base tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch Nautilus 48.7 and apply OpentiaFiles overlay
        run: |
          set -eux
          echo '--- workspace before clone ---'; ls -la
          rm -rf nsrc
          git clone --depth 1 --branch 48.7 https://github.com/GNOME/nautilus.git nsrc
          rm -rf nsrc/.git
          cp -a overlay/48/. nsrc/
          while IFS= read -r f; do
            [ -n "$f" ] && rm -f "nsrc/$f" || true
          done < deletes-48.txt

      - name: Build dependencies
        run: |
          set -eux
          for f in /etc/apt/sources.list.d/*.sources; do
            [ -f "$f" ] && sed -i 's/^Types: deb$/Types: deb deb-src/' "$f" || true
          done
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential binutils meson ninja-build pkg-config gettext dpkg-dev \
            desktop-file-utils || true
          apt-get build-dep -y nautilus || true
          apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libglib2.0-dev libgnome-desktop-4-dev \
            libgexiv2-dev libportal-dev libxml2-dev libgdk-pixbuf-2.0-dev \
            libcloudproviders-dev libexif-dev libselinux1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gsettings-desktop-schemas-dev gnome-autoar-0-dev libgnome-autoar-0-dev \
            libtracker-sparql-3.0-dev || true

      - name: Show library versions
        run: pkg-config --modversion gtk4 libadwaita-1 glib-2.0 2>/dev/null || true

      - name: Configure, build, package
        working-directory: nsrc
        run: |
          set -eux
          meson setup builddir --prefix=/usr -Dtests=none
          ninja -C builddir
          bash ../packaging/make-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: opentiafiles-deb-48-49
          path: nsrc/opentiafiles_*.deb
          if-no-files-found: error

      - name: Verify the .deb installs alongside the distro's nautilus
        working-directory: nsrc
        run: |
          set -eux
          apt-get install -y --no-install-recommends nautilus || true
          apt-get install -y ./*.deb
          dpkg -s opentiafiles | grep -E '^Status'
          dpkg -s nautilus    | grep -E '^Status'
          test -x /usr/bin/opentia-files
          test -x /usr/bin/opentiafiles

          # every NEEDED shared library must be provided by a package we depend on
          deps="$(dpkg-query -W -f='${Depends}' opentiafiles | tr ',|' '\n' | sed 's/(.*//' | tr -d ' ')"
          echo "Depends: $deps"
          missing=""
          for f in /usr/bin/opentia-files /usr/lib/*/libnautilus-extension.so.* /usr/lib/*/nautilus/extensions-*/*.so; do
            [ -f "$f" ] || continue
            for so in $(objdump -p "$f" 2>/dev/null | awk '/NEEDED/{print $2}'); do
              path="$(ldconfig -p 2>/dev/null | awk -v s="$so" '$1==s {print $NF; exit}')"
              if [ -z "$path" ]; then echo "UNRESOLVED: $so (in $f)"; continue; fi
              owner="$(dpkg -S "$path" 2>/dev/null | head -1 | cut -d: -f1)"
              if [ -z "$owner" ] || [ "$owner" = "opentiafiles" ]; then continue; fi
              if ! printf '%s\n' "$deps" | grep -qx "$owner"; then
                missing="$missing $so=$owner"
              fi
            done
          done
          if [ -n "$missing" ]; then
            echo "DEPS COVERAGE FAILED:$missing"
            exit 1
          fi
          echo "DEPS COVERAGE OK"
          echo "INSTALL OK (coexists with nautilus)"

      - name: Smoke test - does the window actually start?
        working-directory: nsrc
        run: |
          set -eux
          apt-get install -y --no-install-recommends xvfb dbus || true
          set +e
          out="$(dbus-run-session -- xvfb-run -a timeout 20 /usr/bin/opentia-files 2>&1)"
          set -e
          echo "$out" | tail -40
          if echo "$out" | grep -Eq "Unable to load resource|assertion failed|Bail out"; then
            echo "SMOKE TEST FAILED"
            exit 1
          fi
          echo "SMOKE TEST OK"

      - name: Capture real screenshots (Xvfb)
        working-directory: nsrc
        run: |
          set -eux
          apt-get install -y --no-install-recommends xvfb dbus imagemagick x11-apps openbox wmctrl xdotool || true
          id -u shotuser >/dev/null 2>&1 || useradd -m -s /bin/bash shotuser
          cat > /tmp/shot.sh <<'EOSH'
          #!/bin/bash
          export DISPLAY=:99
          openbox >/dev/null 2>&1 &
          sleep 3
          maximize() { WID=$(wmctrl -l | awk 'NR==1{print $1}'); if [ -n "$WID" ]; then wmctrl -i -r "$WID" -b add,maximized_vert,maximized_horz || true; fi; }
          /usr/bin/opentia-files &
          sleep 24
          maximize; sleep 4
          import -window root /tmp/shot-home.png || true
          pkill -f opentia-files; sleep 3
          /usr/bin/opentia-files /usr/share &
          sleep 22
          maximize; sleep 4
          import -window root /tmp/shot-folder.png || true
          xdotool mousemove 326 197 click 3
          sleep 3
          import -window root /tmp/shot-context.png || true
          xdotool key Escape; sleep 2
          xdotool mousemove 275 66 click 1
          sleep 3
          import -window root /tmp/shot-menubar.png || true
          xdotool key Escape; sleep 2
          gapplication action io.github.bhuveevh.OpentiaFiles preferences &
          sleep 9
          import -window root /tmp/shot-prefs.png || true
          pkill -f opentia-files || true
          EOSH
          chmod 0755 /tmp/shot.sh
          Xvfb :99 -screen 0 1366x768x24 -ac >/tmp/xvfb.log 2>&1 &
          sleep 3
          su shotuser -c 'dbus-run-session -- /tmp/shot.sh' >/tmp/app.log 2>&1 || true
          ls -l /tmp/shot-*.png || true
          for f in home folder context menubar prefs; do cp /tmp/shot-$f.png ./shot-$f.png 2>/dev/null || true; done
          echo '--- app log ---'
          tail -40 /tmp/app.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-50
          path: |
            nsrc/shot-home.png
            nsrc/shot-folder.png
            nsrc/shot-context.png
            nsrc/shot-menubar.png
            nsrc/shot-prefs.png
          if-no-files-found: warn

  build-50:
    name: .deb for GNOME 50
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Base tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch Nautilus 50.4 and apply OpentiaFiles overlay
        run: |
          set -eux
          echo '--- workspace before clone ---'; ls -la
          rm -rf nsrc
          git clone --depth 1 --branch 50.4 https://github.com/GNOME/nautilus.git nsrc
          rm -rf nsrc/.git
          cp -a overlay/50/. nsrc/
          while IFS= read -r f; do
            [ -n "$f" ] && rm -f "nsrc/$f" || true
          done < deletes-50.txt

      - name: Build dependencies
        run: |
          set -eux
          for f in /etc/apt/sources.list.d/*.sources; do
            [ -f "$f" ] && sed -i 's/^Types: deb$/Types: deb deb-src/' "$f" || true
          done
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential binutils meson ninja-build pkg-config gettext dpkg-dev \
            desktop-file-utils blueprint-compiler || true
          apt-get build-dep -y nautilus || true
          apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libglib2.0-dev libgnome-desktop-4-dev \
            libportal-dev libxml2-dev libgdk-pixbuf-2.0-dev \
            libcloudproviders-dev libexif-dev libselinux1-dev \
            gsettings-desktop-schemas-dev libgnome-autoar-0-dev \
            libtinysparql-dev libglycin-2-dev libglycin-gtk4-2-dev || true

      - name: Show library versions
        run: pkg-config --modversion gtk4 libadwaita-1 glib-2.0 2>/dev/null || true

      - name: Configure, build, package
        working-directory: nsrc
        run: |
          set -eux
          meson setup builddir --prefix=/usr -Dtests=none -Dextensions=false
          ninja -C builddir
          bash ../packaging/make-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: opentiafiles-deb-50
          path: nsrc/opentiafiles_*.deb
          if-no-files-found: error

      - name: Verify the .deb installs alongside the distro's nautilus
        working-directory: nsrc
        run: |
          set -eux
          apt-get install -y --no-install-recommends nautilus || true
          apt-get install -y ./*.deb
          dpkg -s opentiafiles | grep -E '^Status'
          dpkg -s nautilus    | grep -E '^Status'
          test -x /usr/bin/opentia-files
          test -x /usr/bin/opentiafiles

          # every NEEDED shared library must be provided by a package we depend on
          deps="$(dpkg-query -W -f='${Depends}' opentiafiles | tr ',|' '\n' | sed 's/(.*//' | tr -d ' ')"
          echo "Depends: $deps"
          missing=""
          for so in $(objdump -p /usr/bin/opentia-files | awk '/NEEDED/{print $2}'); do
            owner="$(dpkg -S "$so" 2>/dev/null | head -1 | cut -d: -f1 || true)"
            if [ -z "$owner" ] || [ "$owner" = "opentiafiles" ]; then
              continue
            fi
            if ! printf '%s\n' "$deps" | grep -qx "$owner"; then
              missing="$missing $so=$owner"
            fi
          done
          if [ -n "$missing" ]; then
            echo "DEPS COVERAGE FAILED:$missing"
            exit 1
          fi
          echo "DEPS COVERAGE OK"
          echo "INSTALL OK (coexists with nautilus)"

      - name: Smoke test - does the window actually start?
        working-directory: nsrc
        run: |
          set -eux
          apt-get install -y --no-install-recommends xvfb dbus || true
          set +e
          out="$(dbus-run-session -- xvfb-run -a timeout 20 /usr/bin/opentia-files 2>&1)"
          set -e
          echo "$out" | tail -40
          if echo "$out" | grep -Eq "Unable to load resource|assertion failed|Bail out"; then
            echo "SMOKE TEST FAILED"
            exit 1
          fi
          echo "SMOKE TEST OK"

      - name: Capture real screenshots (Xvfb)
        working-directory: nsrc
        run: |
          set -eux
          apt-get install -y --no-install-recommends xvfb dbus imagemagick x11-apps openbox wmctrl || true
          id -u shotuser >/dev/null 2>&1 || useradd -m -s /bin/bash shotuser
          cat > /tmp/shot.sh <<'EOSH'
          #!/bin/bash
          export DISPLAY=:99
          export XDG_RUNTIME_DIR=/tmp/xdg-$$
          mkdir -p "$XDG_RUNTIME_DIR"
          openbox >/dev/null 2>&1 &
          sleep 3
          maximize() { WID=$(wmctrl -l | awk 'NR==1{print $1}'); if [ -n "$WID" ]; then wmctrl -i -r "$WID" -b add,maximized_vert,maximized_horz || true; fi; }
          /usr/bin/opentia-files &
          sleep 24
          wmctrl -l || true
          maximize; sleep 4
          import -window root /tmp/shot-home.png || true
          pkill -f opentia-files || true
          sleep 4
          /usr/bin/opentia-files /usr/share &
          sleep 22
          maximize; sleep 4
          import -window root /tmp/shot-folder.png || true
          pkill -f opentia-files || true
          EOSH
          chmod 0755 /tmp/shot.sh
          Xvfb :99 -screen 0 1366x768x24 -ac >/tmp/xvfb.log 2>&1 &
          sleep 3
          su shotuser -c 'dbus-run-session -- /tmp/shot.sh' >/tmp/app.log 2>&1 || true
          ls -l /tmp/shot-*.png || true
          cp /tmp/shot-home.png ./shot-home.png || true
          cp /tmp/shot-folder.png ./shot-folder.png || true
          echo '--- app log ---'
          tail -50 /tmp/app.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-50
          path: |
            nsrc/shot-home.png
            nsrc/shot-folder.png
          if-no-files-found: warn
